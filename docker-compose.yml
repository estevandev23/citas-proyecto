name: citas-brayan

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Bogota

    ports:
      - "${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s


  citas-api-dev:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped

    working_dir: /workspace

    volumes:
      - ./citas-api:/workspace
      - maven_cache:/root/.m2

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${REACT_PORT:-5173}}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      PASSWORD_RECOVERY_EXPOSE_TOKEN: ${PASSWORD_RECOVERY_EXPOSE_TOKEN:-false}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      TEST_DATA_ENABLED: ${TEST_DATA_ENABLED:-true}

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      mysql:
        condition: service_healthy

    command: ["mvn", "spring-boot:run"]


  citas-web-dev:
    image: node:24-alpine
    restart: unless-stopped

    working_dir: /workspace

    volumes:
      - ./citas-web:/workspace
      - citas_web_node_modules:/workspace/node_modules
      - citas_web_next:/workspace/.next
      - node_cache:/root/.npm

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8080}}

    ports:
      - "${REACT_PORT:-5173}:5173"
      - "${ANGULAR_PORT:-4200}:4200"

    depends_on:
      - citas-api-dev

    command:
      - sh
      - -lc
      - if [ ! -f node_modules/.bin/next ]; then npm install --no-audit --no-fund; fi; exec npm run dev -- --hostname 0.0.0.0 --port 5173


volumes:
  mysql_data:
  maven_cache:
  node_cache:
  citas_web_node_modules:
  citas_web_next:
